version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    # Hashed Astro assets in /_astro/ are content-hashed at build time — cache forever.
    - pattern: '/_astro/**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    # Static images, fonts, favicons in /public — cache for a day, revalidate.
    - pattern: '/*.(png|jpg|jpeg|webp|avif|svg|ico|woff|woff2)'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=86400, must-revalidate'
    # HTML pages must always revalidate so deploys land instantly.
    - pattern: '**/*.html'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
    # Security baseline.
    - pattern: '**/*'
      headers:
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'
        - key: 'Permissions-Policy'
          value: 'camera=(), microphone=(), geolocation=()'
